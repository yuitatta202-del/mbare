
<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =====================================
         MBARE - BRAND & SEO
    ====================================== -->

    <title>
      MBARE | Community, Notizie ed Eventi per Studenti Universitari
    </title>

    <meta
      name="description"
      content="MBARE è la community degli studenti universitari: scopri notizie, eventi, gruppi di studio, annunci e confessioni. Vivi l'università senza filtri."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large"
    />

    <meta name="author" content="MBARE" />
    <meta name="application-name" content="MBARE" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Canonical della homepage.
         Nelle pagine interne deve essere aggiornato
         con l'URL specifico di quella pagina. -->
    <link
      rel="canonical"
      href="https://mbare.site/"
    />

    <!-- =====================================
         FAVICON
    ====================================== -->

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- =====================================
         OPEN GRAPH / SOCIAL SHARING
    ====================================== -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MBARE" />
    <meta property="og:locale" content="it_IT" />

    <meta
      property="og:title"
      content="MBARE | La Community degli Studenti Universitari"
    />

    <meta
      property="og:description"
      content="Notizie, eventi, gruppi di studio, annunci e confessioni. Scopri MBARE, la community universitaria senza filtri."
    />

    <meta
      property="og:url"
      content="https://mbare.site/"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="MBARE | La Community degli Studenti Universitari"
    />

    <meta
      name="twitter:description"
      content="News, eventi, community e gruppi di studio. Vivi l'università con MBARE."
    />

    ====================================== -->

            "@id": "https://mbare.site/#organization",
            "name": "MBARE",
            "url": "https://mbare.site/",
            "description": "MBARE è una piattaforma online dedicata alla community degli studenti universitari."
          },
          {
            "@type": "WebSite",
            "@id": "https://mbare.site/#website",
            "url": "https://mbare.site/",
            "name": "MBARE",
            "inLanguage": "it-IT",
            "publisher": {
              "@id": "https://mbare.site/#organization"
            }
          }
        ]
      }
    </script>
