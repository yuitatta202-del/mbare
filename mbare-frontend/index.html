
<!doctype html>
<html lang="it">
  <head>
    <!-- =====================================
         MBARE - DOCUMENT SETTINGS
    ====================================== -->

    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="MBARE" />
    <meta name="apple-mobile-web-app-title" content="MBARE" />

    <!-- =====================================
         MBARE - SEO
    ====================================== -->

    <title>MBARE | Community, Notizie ed Eventi per Studenti Universitari</title>

    <meta
      name="description"
      content="MBARE è la community degli studenti universitari: scopri notizie, eventi, gruppi di studio, annunci e confessioni. Vivi l'università senza filtri."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <meta
      name="author"
      content="MBARE"
    />

    <!-- Canonical iniziale della homepage.
         IMPORTANTE: per le pagine interne serve
         un canonical specifico per ogni URL. -->
    <link
      rel="canonical"
      href="https://mbare.site/"
    />

    <!-- =====================================
         MBARE - FAVICON
    ====================================== -->

    <!-- Icona browser -->
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />

    <!-- Icona PNG per browser e Google -->
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/favicon-48.png"
    />

    <!-- Icona per iPhone e iPad -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!-- =====================================
         OPEN GRAPH - FACEBOOK / WHATSAPP
    ====================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="MBARE"
    />

    <meta
      property="og:locale"
      content="it_IT"
    />

    <meta
      property="og:title"
      content="MBARE | La Community degli Studenti Universitari"
    />

    <meta
      property="og:description"
      content="Notizie, eventi, gruppi di studio, annunci e confessioni. Scopri MBARE, la community universitaria senza filtri."
    />

    <meta
      property="og:url"
      content="https://mbare.site/"
    />

    <!-- =====================================
         X / TWITTER
    ====================================== -->

    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="MBARE | La Community degli Studenti Universitari"
    />

    <meta
      name="twitter:description"
      content="News, eventi, community e gruppi di studio. Vivi l'università con MBARE."
    />

          },
          {
            "@type": "WebSite",
            "@id": "https://mbare.site/#website",
            "url": "https://mbare.site/",
            "name": "MBARE",
            "description": "Community, notizie, eventi e gruppi di studio per studenti universitari.",
            "inLanguage": "it-IT",
            "publisher": {
              "@id": "https://mbare.site/#organization"
            }
          }
        ]
      }
